name: Bug Report
description: Report a bug or unexpected behavior in a LiveStore contrib package
title: '[Bug]: '
labels: ['type:bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out this form as completely as possible.

        Before you start, please search existing issues to see whether the bug has already been reported.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Describe what happened and what you expected to happen
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: |
        Please provide a minimal reproduction of the issue.
        - Create a minimal example that reproduces the bug
        - Use StackBlitz, CodeSandbox, or a GitHub repository when possible
        - Remove code not related to the issue
      placeholder: |
        Please provide:
        - Link to StackBlitz/CodeSandbox/GitHub repo
        - Or paste minimal code example here
    validations:
      required: true

  - type: input
    id: livestore-version
    attributes:
      label: LiveStore Version
      description: What version of LiveStore are you using?
      placeholder: e.g. 0.4.0
    validations:
      required: true

  - type: input
    id: package
    attributes:
      label: Which package(s) are affected?
      description: List the affected contrib packages
      placeholder: e.g. @livestore/adapter-node, @livestore/svelte
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide details about your environment
      value: |
        - OS:
        - Node.js version:
        - Package manager:
        - Runtime: (browser/Node.js/Expo/other)
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs/Screenshots
      description: If applicable, add error logs, stack traces, or screenshots to help explain the problem.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this bug has not already been reported
          required: true
        - label: I have provided a minimal reproduction that demonstrates the issue
          required: true
        - label: I have included all requested information above
          required: true
