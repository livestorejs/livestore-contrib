[package]
name = "livestore"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
futures.workspace = true
livestore-core.workspace = true
livestore-schema.workspace = true
livestore-sqlite.workspace = true
livestore-sync.workspace = true
parking_lot = "0.12"
rusqlite = { workspace = true, features = ["serialize"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
livestore-sync = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
trybuild = "1"
