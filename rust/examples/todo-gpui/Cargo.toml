# Own workspace: each example keeps its UI dependencies and lockfile to itself.
[workspace]

[package]
name = "todo-gpui"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false


[[bin]]
name = "todo-gpui"
path = "src/main.rs"

[dependencies]
livestore = { path = "../../crates/livestore" }
livestore-schema = { path = "../../crates/livestore-schema" }
livestore-sqlite = { path = "../../crates/livestore-sqlite" }
livestore-sync = { path = "../../crates/livestore-sync" }
livestore-sync-cf = { path = "../../crates/livestore-sync-cf" }
livestore-todomvc = { path = "../../crates/livestore-todomvc" }
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "sync", "time", "net"] }

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
dbg_macro = "warn"
map_unwrap_or = "warn"
needless_collect = "warn"
redundant_clone = "warn"
unnecessary_wraps = "warn"
todo = "warn"
print_stdout = "warn"

