# Own workspace: each example keeps its UI dependencies and lockfile to itself.
[workspace]

[package]
name = "todo-rune"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[[bin]]
name = "todo-rune"
path = "src/main.rs"

[dependencies]
livestore = { path = "../../crates/livestore" }
livestore-schema = { path = "../../crates/livestore-schema" }
livestore-sqlite = { path = "../../crates/livestore-sqlite" }
livestore-sync = { path = "../../crates/livestore-sync" }
livestore-sync-cf = { path = "../../crates/livestore-sync-cf" }
livestore-todomvc = { path = "../../crates/livestore-todomvc" }
# rune is pre-release: pinned to a commit.
rune = { git = "https://github.com/anomalyco/rune", rev = "86b903de7fef9c6b683e05dc23440de4ebbc4347" }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "time"] }

# rune vendors patched crates; a dependency's [patch] does not reach us, so repeat it.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "86b903de7fef9c6b683e05dc23440de4ebbc4347" }
winit = { git = "https://github.com/anomalyco/rune", rev = "86b903de7fef9c6b683e05dc23440de4ebbc4347" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "86b903de7fef9c6b683e05dc23440de4ebbc4347" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "86b903de7fef9c6b683e05dc23440de4ebbc4347" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "86b903de7fef9c6b683e05dc23440de4ebbc4347" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "86b903de7fef9c6b683e05dc23440de4ebbc4347" }

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
dbg_macro = "warn"
map_unwrap_or = "warn"
needless_collect = "warn"
redundant_clone = "warn"
unnecessary_wraps = "warn"
todo = "warn"
print_stdout = "warn"
