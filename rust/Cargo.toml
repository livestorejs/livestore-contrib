[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
dbg_macro = "warn"
map_unwrap_or = "warn"
needless_collect = "warn"
redundant_clone = "warn"
unnecessary_wraps = "warn"
todo = "warn"
print_stdout = "warn"

[workspace.dependencies]
livestore-core = { path = "crates/livestore-core" }
livestore-schema = { path = "crates/livestore-schema" }
livestore-macros = { path = "crates/livestore-macros" }
livestore-sqlite = { path = "crates/livestore-sqlite" }
livestore-sync = { path = "crates/livestore-sync" }
livestore = { path = "crates/livestore" }
livestore-todomvc = { path = "crates/livestore-todomvc" }
futures = "0.3.34"
rusqlite = { version = "=0.37.0", features = ["bundled", "session"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-std", "io-util", "process"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
