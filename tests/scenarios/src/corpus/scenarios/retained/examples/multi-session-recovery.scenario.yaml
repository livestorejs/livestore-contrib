application: todo
about: A later session joins one Client leader and both recover through session and Client restarts.

clients:
  client-a:
    sessions: [session-a1]

do:
  - note: Both sessions write through the same Client leader.

  - run: createTodo
    as: client-a/session-a1
    with:
      id: todo-session-a1
      text: Written by the first session

  - addSession: client-a/session-a2

  - run: createTodo
    as: client-a/session-a2
    with:
      id: todo-session-a2
      text: Written by the second session

  - settle: [client-a/session-a1, client-a/session-a2]

  - note: The first session stops, its sibling continues through Leader turnover, then it returns.

  - stopSession: client-a/session-a1

  - run: createTodo
    as: client-a/session-a2
    with:
      id: todo-after-leader-turnover
      text: Written after the initial Leader session closes

  - restartSession: client-a/session-a1
  - settle: [client-a/session-a1, client-a/session-a2]

  - note: The entire Client restarts and restores both sessions before converging.

  - restartClient: client-a

expect:
  participants: [client-a/session-a1, client-a/session-a2]
  pending: resolved
  eventlogs: converge
  state:
    todos:
      converge: true
      containsIds: [todo-session-a1, todo-session-a2, todo-after-leader-turnover]
