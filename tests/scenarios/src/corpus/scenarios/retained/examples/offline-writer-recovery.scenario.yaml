application: todo
about: An offline Client and an online Client both write before reconnecting and converging.

clients:
  client-a:
    sessions: [session-a]
  client-b:
    sessions: [session-b]

do:
  - note: Client A writes offline while Client B writes against the shared backend.

  - disconnect: client-a

  - concurrently:
      - run: createTodo
        as: client-a/session-a
        with:
          id: todo-offline-a
          text: Written while Client A is offline

      - run: createTodo
        as: client-b/session-b
        with:
          id: todo-online-b
          text: Written while Client B is online
    expect: overlap

  - settle: client-b/session-b

  - note: Client A reconnects before the final expectations establish a stable shared head.

  - reconnect: client-a

expect:
  pending: resolved
  eventlogs: converge
  state:
    todos:
      converge: true
      containsIds: [todo-offline-a, todo-online-b]
