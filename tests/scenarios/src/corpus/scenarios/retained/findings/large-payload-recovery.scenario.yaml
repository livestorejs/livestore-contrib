application: todo
parameters:
  payload_bytes:
    type: integer
    default: 899643
about: An Event with a ${payload_bytes}-byte string crosses offline storage and backend synchronization.

clients:
  client-a:
    sessions: [session-a]
  client-b:
    sessions: [session-b]

do:
  - note: Commit the payload while Client A cannot reach the backend.

  - disconnect: client-a

  - generate: largeStringAction
    with:
      target: client-a/session-a
      action: createTodo
      input:
        id: large-payload
      field: text
      bytes: ${payload_bytes}

  - reconnect: client-a

expect:
  pending: resolved
  eventlogs: converge
  state:
    todos:
      converge: true
      containsIds: [large-payload]
