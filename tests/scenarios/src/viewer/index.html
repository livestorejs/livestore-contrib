<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiveStore scenario replay</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="toolbar">
        <div>
          <h1 id="run-title">scenario</h1>
          <p id="run-summary" class="summary">Load a completed run artifact to begin.</p>
        </div>
        <div class="controls">
          <label class="file-button">
            open
            <input id="artifact-file" type="file" accept="application/json,.json" />
          </label>
          <button id="load-default" type="button" title="Load generated offline writer recovery run">example</button>
          <button id="play" type="button" disabled>play</button>
        </div>
      </header>

      <section aria-labelledby="system-state-heading">
        <div class="section-heading">
          <h2 id="system-state-heading">System</h2>
          <div id="run-status" class="badge neutral">Not loaded</div>
        </div>
        <div id="system-state" class="empty-state">Choose an artifact above.</div>
      </section>

      <section aria-labelledby="timeline-heading">
        <div class="section-heading">
          <div class="timeline-heading-copy">
            <h2 id="timeline-heading">Timeline</h2>
            <p id="trace-name" class="trace-name">No trace loaded</p>
          </div>
          <div class="timeline-meta">
            <span id="cursor-label">0 / 0</span>
            <span id="record-label">No observation selected</span>
          </div>
        </div>
        <p id="event-selection" class="selection-copy">Select an event to highlight its path.</p>
        <div id="timeline" class="timeline empty-state">No trace loaded.</div>
      </section>

      <section class="details" aria-labelledby="details-heading">
        <div class="section-heading">
          <h2 id="details-heading">Trace</h2>
        </div>
        <pre id="record-details">No trace record selected.</pre>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
