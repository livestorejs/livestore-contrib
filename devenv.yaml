require_version: '>=2.1'
inputs:
  devenv:
    url: github:cachix/devenv/v2.1
  nixpkgs:
    follows: effect-utils/nixpkgs
  effect-utils:
    # Tracks `main` (the default-ref policy first-party inputs must follow); the
    # concrete revision stays frozen in devenv.lock and must match the one
    # megarepo.lock records — mr:lock-sync-check compares them.
    url: github:overengineeringstudio/effect-utils/main
